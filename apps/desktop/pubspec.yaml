name: syncstuff_desktop
description: "SyncStuff Desktop - P2P file sync companion app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  get_it: ^9.2.1

  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.4+4
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3

  http: ^1.4.0
  uuid: ^4.5.1
  path: ^1.9.1
  intl: ^0.20.2

  google_fonts: ^8.1.0
  file_picker: ^11.0.2

  syncstuff_core:
    path: ../../packages/core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1565C0"/>
      <stop offset="100%" stop-color="#0D47A1"/>
    </linearGradient>
    <linearGradient id="arc1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#90CAF9"/>
    </linearGradient>
    <linearGradient id="arc2" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#69F0AE" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#00E676"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect x="80" y="80" width="864" height="864" rx="190" ry="190" fill="url(#bg)" filter="url(#shadow)"/>

  <!-- Subtle highlight on top half -->
  <rect x="100" y="100" width="824" height="380" rx="170" ry="170" fill="white" opacity="0.07"/>

  <!-- Upper arc (white/blue) - CW path with arrowhead -->
  <path d="M 512 270 A 200 200 0 0 1 690 430" 
        fill="none" stroke="url(#arc1)" stroke-width="52" stroke-linecap="round"/>
  <!-- Arrowhead for upper arc -->
  <polygon points="695,395 730,440 680,445" fill="white"/>

  <!-- Lower arc (green) - CW path with arrowhead going up -->
  <path d="M 512 754 A 200 200 0 0 1 334 594" 
        fill="none" stroke="url(#arc2)" stroke-width="52" stroke-linecap="round"/>
  <!-- Arrowhead for lower arc -->
  <polygon points="329,629 294,584 344,579" fill="#69F0AE"/>

  <!-- Center circle -->
  <circle cx="512" cy="512" r="58" fill="white" opacity="0.95"/>
  <circle cx="512" cy="512" r="35" fill="#1565C0"/>

  <!-- Small sync dot in center -->
  <circle cx="512" cy="512" r="14" fill="white"/>
</svg>
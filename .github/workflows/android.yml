name: Android CI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable

      - name: Install Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Build Android APK
        working-directory: apps/mobile
        run: flutter build apk --debug

      - name: Get version
        id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=latest" >> $GITHUB_OUTPUT
          fi

      - name: Prepare APK for Release
        run: cp apps/mobile/build/app/outputs/flutter-apk/app-debug.apk apps/mobile/build/app/outputs/flutter-apk/syncstuff-${{ steps.version.outputs.VERSION }}-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: syncstuff-${{ steps.version.outputs.VERSION }}-debug
          path: apps/mobile/build/app/outputs/flutter-apk/syncstuff-${{ steps.version.outputs.VERSION }}-debug.apk

      - name: Create GitHub Release (Draft)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          name: Release ${{ steps.version.outputs.VERSION }}
          files: |
            apps/mobile/build/app/outputs/flutter-apk/syncstuff-${{ steps.version.outputs.VERSION }}-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}